    <script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
    <script>document.documentElement.classList.add('mo-js');setTimeout(()=>document.documentElement.classList.add('mo-safe'),2500)</script>
    <link rel="modulepreload" href="/assets/moments/moments.js" />
    <link rel="modulepreload" href="/assets/moments/lib.js" />
    <link rel="modulepreload" href="/assets/moments/letters-assemble/moment.js" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const motionUrl = new URL('/assets/motion/motion.js', window.location.href).href;
      const momentsUrl = new URL('/assets/moments/moments.js', window.location.href).href;
      const [motion, moments] = await Promise.all([
        import(/* @vite-ignore */ motionUrl),
        import(/* @vite-ignore */ momentsUrl),
      ]);
      window.myLoveMotion = { refresh: motion.refresh };
      window.myLoveMoments = { mountAll: moments.mountAll };
    </script>
  </body>
